[project]
name = "klavyra-worker"
version = "0.1.0"
description = "Klavyra AI worker: audio/video -> piano MIDI, MusicXML and PDF"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.48",
    "yt-dlp>=2026.1.1",
    "mido>=1.3",
    "music21>=9.1",
    "soundfile>=0.13",
    "torch>=2.7",
    "piano-transcription-inference>=0.0.6",
    "audioread>=3.0",  # imported by piano-transcription-inference but not declared by it
    "beat-this>=1.1",
    "muscriptor>=0.4",
]

[project.scripts]
klavyra = "klavyra_worker.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["klavyra_worker"]

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

# CUDA 12.8 wheels (RTX 30xx and newer).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
