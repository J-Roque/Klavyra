<section class="relative min-h-full flex flex-col items-center justify-center px-4 py-10 overflow-hidden">
  <!-- Klavyra's idea in one picture: sound on the left becomes notation on the right, on one staff. -->
  <svg aria-hidden="true" class="hidden lg:block absolute inset-x-0 top-1/2 -translate-y-1/2 w-full h-52" viewBox="0 0 1200 120" preserveAspectRatio="xMidYMid slice">
    @for (y of [20, 40, 60, 80, 100]; track y) {
      <line x1="0" x2="1200" [attr.y1]="y" [attr.y2]="y" stroke="#cdc7b6" stroke-width=".6" />
    }
    @for (b of bars; track b.x) {
      <rect [attr.x]="b.x" [attr.y]="60 - b.h / 2" width="4" [attr.height]="b.h" rx="2" fill="#1f9672" [attr.opacity]="b.o" />
    }
    @for (n of notes; track n.x) {
      <g fill="#10614b" [attr.opacity]="n.o">
        <ellipse [attr.cx]="n.x" [attr.cy]="n.y" rx="9" ry="6.5" [attr.transform]="'rotate(-20 ' + n.x + ' ' + n.y + ')'" />
        <rect [attr.x]="n.x + 7" [attr.y]="n.y - 46" width="1.8" height="46" />
      </g>
    }
  </svg>

  <div class="relative z-10 w-full max-w-[29rem] flex flex-col items-center gap-7">
    <div class="text-center">
      <p class="k-eyebrow text-primary-700 m-0 mb-3">Transcripción de piano con IA</p>
      <h1 class="k-display text-4xl sm:text-5xl font-normal leading-[1.08] m-0">
        Del sonido a la <em class="text-primary-700">partitura</em>
      </h1>
    </div>

    <div class="app-dark w-full rounded-2xl bg-ink-2 text-surface-0 overflow-hidden shadow-[0_24px_60px_-20px_rgba(6,36,28,.55)]">
      <div class="p-4 sm:p-5 flex flex-col gap-4">
        <p-fileupload
          #upload
          class="klav-upload"
          mode="advanced"
          [customUpload]="true"
          [auto]="true"
          [accept]="accept"
          [maxFileSize]="maxBytes"
          invalidFileSizeMessageSummary="{0} es demasiado grande:"
          invalidFileSizeMessageDetail="el máximo es {0}."
          invalidFileTypeMessageSummary="{0} no es un archivo de audio o video:"
          invalidFileTypeMessageDetail="prueba con MP3, WAV, M4A o MP4."
          (onSelect)="onSelect(upload)"
          (uploadHandler)="onFiles($event, upload)"
        >
          <ng-template #content let-chooseCallback="chooseCallback">
            <div class="flex flex-col items-center gap-3 text-center">
              <p-button label="Subir audio o video" icon="pi pi-upload" size="large" styleClass="k-brass" (onClick)="chooseCallback()" />
              <span class="text-sm text-surface-300">o arrástralo aquí · MP3, WAV, M4A, MP4…</span>
            </div>
          </ng-template>
        </p-fileupload>

        <div class="flex gap-2">
          <p-iconfield class="flex-1 min-w-0">
            <p-inputicon styleClass="pi pi-link" />
            <input
              pInputText
              class="w-full"
              placeholder="Pega un enlace de YouTube o TikTok"
              aria-label="Enlace"
              autocomplete="off"
              [ngModel]="url()"
              (ngModelChange)="url.set($event)"
              (keydown.enter)="useUrl()"
            />
          </p-iconfield>
          <p-button icon="pi pi-arrow-right" severity="secondary" ariaLabel="Usar enlace" [disabled]="!urlValid()" (onClick)="useUrl()" />
          <p-button
            [icon]="recording() ? 'pi pi-stop-circle' : 'pi pi-microphone'"
            [label]="recording() ? formatTime(recordSeconds()) : undefined"
            [severity]="recording() ? 'danger' : 'secondary'"
            [ariaLabel]="recording() ? 'Detener grabación' : 'Grabar audio'"
            [pTooltip]="recording() ? 'Detener' : 'Grabar audio'"
            tooltipPosition="top"
            (onClick)="toggleRecording()"
          />
        </div>
      </div>
      <div aria-hidden="true" class="k-keys h-12"></div>
    </div>
  </div>
</section>

<p-dialog
  [visible]="dialogOpen()"
  (visibleChange)="closeDialog()"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: '28rem' }"
  [breakpoints]="{ '640px': '92vw' }"
>
  <ng-template #header>
    <span class="k-display text-2xl">Antes de empezar</span>
  </ng-template>
  <div class="flex flex-col gap-4">
    <p class="m-0 text-sm text-muted-color break-all"><i class="pi pi-music mr-1 text-xs"></i>{{ sourceName() }}</p>

    <div class="flex flex-col gap-2">
      <label for="title" class="font-semibold text-sm">Título <span class="text-muted-color font-normal">(opcional)</span></label>
      <input pInputText id="title" maxlength="200" [ngModel]="projectTitle()" (ngModelChange)="projectTitle.set($event)" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="engine" class="font-semibold text-sm">Motor de IA</label>
      <p-select inputId="engine" appendTo="body" class="w-full" [options]="engines" optionLabel="label" optionValue="value" [ngModel]="engine()" (ngModelChange)="engine.set($event)" />
    </div>

    @if (engine() === 'muscriptor') {
      <div class="flex flex-col gap-2">
        <label for="model" class="font-semibold text-sm">Tamaño del modelo</label>
        <p-select inputId="model" appendTo="body" class="w-full" [options]="models" optionLabel="label" optionValue="value" [ngModel]="model()" (ngModelChange)="model.set($event)" />
      </div>
    }
  </div>

  <ng-template #footer>
    <p-button label="Cancelar" severity="secondary" [text]="true" [disabled]="submitting()" (onClick)="closeDialog()" />
    <p-button label="Transcribir" icon="pi pi-arrow-right" iconPos="right" [loading]="submitting()" (onClick)="submit()" />
  </ng-template>
</p-dialog>
